name: Reaction engine tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check application JavaScript syntax
        run: node --check app.js && node --check supabase-client.js && node --check reaction-engine.js && node --check reaction-visuals.js && node --check song-engine.js
      - name: Run reaction engine and visual tests
        run: node --test reaction-engine.test.js reaction-visuals.test.js song-engine.test.js
